<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Brutalist Input Selector</title>
	<style>
		:root {
			--bg: #1e252a;
			--ink: #f4f4f4;
			--accent: #f13b3b;
			--line: #c7c2b5;
			--shadow: 0;
			--label-radius: 150px;
			font-family: 'IBM Plex Mono', 'Courier New', monospace;
		}

		* {
			box-sizing: border-box;
		}

		body {
			background: var(--bg);
			color: var(--ink);
			display: grid;
			place-items: center;
			min-height: 100vh;
			margin: 0;
		}

		.panel {
			position: relative;
			background: transparent;
			padding: 40px 48px 60px;
			border: 3px solid var(--ink);
			width: min(720px, 92vw);
			overflow: hidden;
			--count: 8;
			--start: 0deg;
			--turn: calc(360deg / var(--count));
			--sel: 0;
		}

		h1 {
			margin: 0 0 36px;
			letter-spacing: 2px;
			font-size: 18px;
			text-transform: uppercase;
		}

		.selector {
			display: grid;
			place-items: center;
		}

		.knob-wrap {
			position: relative;
			width: 320px;
			height: 320px;
			display: grid;
			place-items: center;
		}

		.knob {
			position: relative;
			width: 180px;
			height: 180px;
			border: 4px solid var(--ink);
			border-radius: 50%;
			background: #11161c;
			box-shadow: var(--shadow);
			z-index: 2;
		}

		.indicator {
			position: absolute;
			width: 10px;
			height: 60px;
			background: var(--accent);
			border-radius: 5px;
			top: 18px;
			left: 50%;
			transform-origin: 50% 72px;
			transform: translateX(-50%) rotate(calc(90deg + var(--start) + (var(--turn) * var(--sel))));
			transition: transform 0.25s ease-in-out;
		}

		.knob::before {
			content: "";
			position: absolute;
			inset: 18px;
			border: 2px solid var(--ink);
			border-radius: 50%;
			opacity: 0.6;
		}

		.dial-labels {
			position: absolute;
			inset: 0;
			display: block;
		}

		.dial-label {
			position: absolute;
			top: 50%;
			left: 50%;
			transform: rotate(calc(var(--start) + (var(--turn) * var(--i)))) translate(var(--label-radius)) rotate(calc(-1 * (var(--start) + (var(--turn) * var(--i))))) translate(-50%, -50%);
			text-decoration: none;
			color: inherit;
			font-size: 14px;
			letter-spacing: 1px;
			display: inline-flex;
			align-items: center;
			gap: 0;
			cursor: pointer;
			user-select: none;
		}

		.dial-label.active {
			color: var(--accent);
		}

		#spokes {
			position: absolute;
			inset: 0;
			display: block;
			pointer-events: none;
		}

		.spoke {
			position: absolute;
			width: 2px;
			height: 110px;
			background: var(--ink);
			top: 50%;
			left: 50%;
			transform-origin: 50% 0%;
			transform: translateX(-50%) rotate(calc(90deg + var(--start) + (var(--turn) * var(--i))));
			opacity: 0.3;
		}

		.advance {
			position: absolute;
			inset: 0;
			cursor: pointer;
			pointer-events: auto;
			background: transparent;
		}

		@media (max-width: 640px) {
			.panel {
				padding: 28px 22px 50px;
			}

			.knob-wrap {
				width: 260px;
				height: 260px;
			}

			.dial-label {
				--label-radius: 118px;
				transform: rotate(calc(var(--start) + (var(--turn) * var(--i)))) translate(var(--label-radius)) rotate(calc(-1 * (var(--start) + (var(--turn) * var(--i))))) translate(-50%, -50%);
				font-size: 13px;
			}
		}
	</style>
</head>

<body>
	<div class="panel">
		<h1>Input Selector</h1>
		<div class="selector">
			<div class="knob-wrap">
				<div class="dial-labels" id="dialLabels">
					<!-- Labels will be generated by JavaScript -->
				</div>
				<div id="spokes">
					<!-- Spokes will be generated by JavaScript -->
				</div>
				<div class="knob">
					<div class="indicator"></div>
					<div class="advance" id="advanceButton" aria-label="Switch to next option"></div>
				</div>
			</div>
		</div>
	</div>

	<script>
		const OPTIONS = [
			'PHONO-2',
			'PHONO-1',
			'TUNER',
			'AUX',
			'CD',
			'TAPE',
			'STREAM',
			'TV'
		];

		let currentIndex = 0;
		let rotationPosition = 0; // Track continuous rotation
		const panel = document.querySelector('.panel');
		const dialLabelsContainer = document.getElementById('dialLabels');
		const spokesContainer = document.getElementById('spokes');
		const advanceButton = document.getElementById('advanceButton');
		const labels = [];

		panel.style.setProperty('--count', OPTIONS.length);

		OPTIONS.forEach((option, index) => {
			// Create label
			const label = document.createElement('label');
			label.className = 'dial-label';
			label.style.setProperty('--i', index);
			label.textContent = option;
			label.dataset.index = index;

			label.addEventListener('click', () => {
				// Calculate the shortest path to the clicked option
				const optionCount = OPTIONS.length;
				const currentMod = rotationPosition % optionCount;
				const diff = index - currentMod;

				if (diff > optionCount / 2) {
					// Go backwards (shorter path)
					rotationPosition += diff - optionCount;
				} else if (diff < -optionCount / 2) {
					// Go forwards (shorter path)
					rotationPosition += diff + optionCount;
				} else {
					// Direct path
					rotationPosition += diff;
				}

				currentIndex = index;
				updateSelector();
			});

			dialLabelsContainer.appendChild(label);
			labels.push(label);

			// Create spoke
			const spoke = document.createElement('div');
			spoke.className = 'spoke';
			spoke.style.setProperty('--i', index);
			spokesContainer.appendChild(spoke);
		});

		function updateSelector() {
			panel.style.setProperty('--sel', rotationPosition);

			labels.forEach((label, index) => {
				if (index === currentIndex) {
					label.classList.add('active');
				} else {
					label.classList.remove('active');
				}
			});
		}

		advanceButton.addEventListener('click', () => {
			rotationPosition++; // Always increment for continuous forward rotation
			currentIndex = (currentIndex + 1) % OPTIONS.length;
			updateSelector();
		});

		updateSelector();
	</script>
</body>

</html>
