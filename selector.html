<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Dial Input Selector</title>
	<style>
		:root {
			--bg: #1e252a;
			--ink: #f4f4f4;
			color: var(--ink);
		}

		* {
			box-sizing: border-box;
		}

		body {
			background: var(--bg);
			color: var(--ink);
			display: grid;
			place-items: center;
			min-height: 100vh;
			margin: 0;
		}
	</style>
	<script src="dial-selector.js"></script>
	<script>
		function getRandomColor() {
			return '#' + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0');
		}

		function handleDialChange(event) {
			console.log('Selected:', event.detail.value);
			event.target.setAttribute('color-indicator', getRandomColor());
			event.target.setAttribute('color-selection', getRandomColor());
		}

		// Example: Listen for change events using addEventListener
		// document.addEventListener('DOMContentLoaded', () => {
		// 	const selector = document.querySelector('dial-selector');
		// 	if (selector) {
		// 		selector.addEventListener('change', (event) => {
		// 			console.log('Selection changed:', event.detail);
		// 			// event.detail contains:
		// 			// - value: the selected option text
		// 			// - index: the selected index
		// 			// - previousValue: the previous option text
		// 			// - previousIndex: the previous index
		// 		});
		// 	}
		// });

		// Example: You can also use the onchange attribute directly:
		// <dial-selector onchange="handleChange(event)"></dial-selector>
		// function handleChange(event) {
		//   console.log('Selected:', event.detail.value);
		// }
	</script>
</head>

<body>
	<dial-selector title="Basic Usage" onchange="handleDialChange(event)"></dial-selector>

	<dial-selector title="Rainbow Indicator" indicator-rainbow onchange="handleDialChange(event)">
	</dial-selector>

	<dial-selector title="Custom Gradient" indicator-gradient="#ff0000, #0000ff" onchange="handleDialChange(event)">
	</dial-selector>

	<dial-selector line-thickness="3" onchange="handleDialChange(event)">
	</dial-selector>

	<dial-selector options="Option 1,Option 2,Option 3,Option 4" title="Custom Configuration" color-indicator="#00ff00" line-thickness="4"
		color-selection="purple" onchange="console.log('Selected:', event.detail.value)">
	</dial-selector>

	<dial-selector options="Option 1,Option 2,Option 3,Option 4,Option 5,Option 6,Option 7,Option 8,Option 9,Option 10"
		title="Custom Configuration" color-indicator="#00ff00" line-thickness="4" color-selection="purple"
		onchange="console.log('Selected:', event.detail.value)">
	</dial-selector>


	<!-- Indicator Length -->
	<dial-selector title="Indicator Length, Longer" length-indicator="120px" onchange="handleDialChange(event)">
	</dial-selector>

	<dial-selector title="Indicator Length, Shorter" length-indicator="30px" onchange="handleDialChange(event)">
	</dial-selector>

	<!-- Example with custom knob sizes and colors for both circles -->
	<dial-selector title="Custom Knob Sizes" radius-outer="100px" width-outer-circle="6px" color-outer-circle="#00ff00" radius-inner="75px"
		width-inner-circle="3px" color-inner-circle="#ff00ff" onchange="handleDialChange(event)">
	</dial-selector>

	<dial-selector options="Option 1,Option 2" title="2 Options" onchange="console.log('Selected:', event.detail.value)">
	</dial-selector>

	<dial-selector options="Option 1,Option 2,Option 3" title="3 Options" onchange="console.log('Selected:', event.detail.value)">
	</dial-selector>

	<dial-selector options="Option 1,Option 2,Option 3,Option 4,Option 5" title="5 Options"
		onchange="console.log('Selected:', event.detail.value)">
	</dial-selector>
</body>

</html>
