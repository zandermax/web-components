<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Brutalist Input Selector</title>
	<style>
		:root {
			--bg: #1e252a;
			--ink: #f4f4f4;
			--accent: #f13b3b;
			--line: #c7c2b5;
			--shadow: 0;
			--label-radius: 150px;
			font-family: 'IBM Plex Mono', 'Courier New', monospace;
		}

		* {
			box-sizing: border-box;
		}

		body {
			background: var(--bg);
			color: var(--ink);
			display: grid;
			place-items: center;
			min-height: 100vh;
			margin: 0;
		}

		.panel {
			position: relative;
			background: transparent;
			padding: 40px 48px 60px;
			border: 3px solid var(--ink);
			width: min(900px, 95vw);
			overflow: visible;
			--indicator-angle: 0deg;
		}

		h1 {
			margin: 0 0 36px;
			letter-spacing: 2px;
			font-size: 18px;
			text-transform: uppercase;
		}

		.selector {
			display: grid;
			grid-template-columns: 200px 320px 200px;
			gap: 40px;
			align-items: center;
			justify-content: center;
		}

		.label-column {
			display: flex;
			flex-direction: column;
			gap: 20px;
			justify-content: center;
		}

		.label-column.left {
			align-items: flex-end;
		}

		.label-column.right {
			align-items: flex-start;
		}

		.knob-wrap {
			position: relative;
			width: 320px;
			height: 320px;
			display: grid;
			place-items: center;
		}

		.knob {
			position: relative;
			width: 180px;
			height: 180px;
			border: 4px solid var(--ink);
			border-radius: 50%;
			background: #11161c;
			box-shadow: var(--shadow);
			z-index: 2;
		}

		.indicator {
			position: absolute;
			width: 10px;
			height: 60px;
			background: var(--accent);
			border-radius: 5px;
			top: 18px;
			left: 50%;
			transform-origin: 50% 72px;
			transform: translateX(-50%) rotate(calc(90deg + var(--indicator-angle)));
			transition: transform 0.25s ease-in;
		}

		.knob::before {
			content: "";
			position: absolute;
			inset: 18px;
			border: 2px solid var(--ink);
			border-radius: 50%;
			opacity: 0.6;
		}

		.dial-label {
			text-decoration: none;
			color: inherit;
			font-size: 14px;
			letter-spacing: 1px;
			display: inline-flex;
			align-items: center;
			gap: 0;
			cursor: pointer;
			user-select: none;
			padding: 8px 12px;
			position: relative;
		}

		.dial-label.active {
			color: var(--accent);
		}

		#lineContainer {
			position: absolute;
			inset: 0;
			pointer-events: none;
			overflow: visible;
		}

		.advance {
			position: absolute;
			inset: 0;
			cursor: pointer;
			pointer-events: auto;
			background: transparent;
		}

		@media (max-width: 900px) {
			.panel {
				padding: 28px 22px 50px;
			}

			.selector {
				grid-template-columns: 150px 260px 150px;
				gap: 20px;
			}

			.knob-wrap {
				width: 260px;
				height: 260px;
			}

			.dial-label {
				font-size: 12px;
				padding: 6px 8px;
			}

			.label-column {
				gap: 16px;
			}
		}
	</style>
</head>

<body>
	<div class="panel">
		<h1>Input Selector</h1>
		<div class="selector">
			<div class="label-column left" id="leftColumn">
				<!-- Left labels will be generated by JavaScript -->
			</div>

			<div class="knob-wrap">
				<svg id="lineContainer" width="100%" height="100%" style="position: absolute; overflow: visible;">
					<!-- Lines will be generated by JavaScript -->
				</svg>
				<div class="knob">
					<div class="indicator"></div>
					<div class="advance" id="advanceButton" aria-label="Switch to next option"></div>
				</div>
			</div>

			<div class="label-column right" id="rightColumn">
				<!-- Right labels will be generated by JavaScript -->
			</div>
		</div>
	</div>

	<script>
		const OPTIONS = [
			'PHONO-2',
			'PHONO-1',
			'TUNER',
			'AUX',
			'CD',
			'TAPE',
			'STREAM',
			'TV'
		];

		let currentIndex = 0;
		let currentAngle = 0; // Track current angle for smooth transitions
		let isInitialized = false; // Track if we've done the initial setup
		const panel = document.querySelector('.panel');
		const leftColumn = document.getElementById('leftColumn');
		const rightColumn = document.getElementById('rightColumn');
		const lineContainer = document.getElementById('lineContainer');
		const advanceButton = document.getElementById('advanceButton');
		const labels = [];
		const lines = [];

		// Calculate spoke angles - avoiding top (45-135°) and bottom (-45 to -135° or 225-315°)
		// Available ranges: right side (-45 to 45°) and left side (135 to 225°)
		const spokeAngles = [];
		const rightArcStart = -45; // degrees
		const rightArcEnd = 45;
		const leftArcStart = 135;
		const leftArcEnd = 225;

		const halfPoint = Math.ceil(OPTIONS.length / 2);
		const rightCount = OPTIONS.length - halfPoint;
		const leftCount = halfPoint;

		// Generate angles for right side (evenly distributed)
		for (let i = 0; i < rightCount; i++) {
			const angle = rightArcStart + (rightArcEnd - rightArcStart) * i / (rightCount - 1);
			spokeAngles.push(angle);
		}

		// Generate angles for left side (evenly distributed)
		for (let i = 0; i < leftCount; i++) {
			const angle = leftArcStart + (leftArcEnd - leftArcStart) * i / (leftCount - 1);
			spokeAngles.push(angle);
		}

		OPTIONS.forEach((option, index) => {
			const isLeft = index >= rightCount; // First items go to right column
			const container = isLeft ? leftColumn : rightColumn;

			// Create label
			const label = document.createElement('label');
			label.className = 'dial-label';
			label.textContent = option;
			label.dataset.index = index;
			label.dataset.angle = spokeAngles[index]; // Store angle for this option

			label.addEventListener('click', () => {
				currentIndex = index;
				updateSelector();
			});

			// Append to containers
			if (isLeft) {
				container.insertBefore(label, container.firstChild);
			} else {
				container.appendChild(label);
			}
			labels.push(label);

			// Create line (spoke + horizontal)
			const line = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
			line.setAttribute('fill', 'none');
			line.setAttribute('stroke', 'var(--ink)');
			line.setAttribute('stroke-width', '2');
			line.setAttribute('opacity', '0.4');
			line.setAttribute('stroke-linejoin', 'miter');
			line.dataset.index = index;
			lineContainer.appendChild(line);
			lines.push(line);
		});

		function updateLines() {
			const knobWrap = document.querySelector('.knob-wrap');
			const centerX = 160; // knob-wrap width / 2
			const centerY = 160; // knob-wrap height / 2
			const knobRadius = 90; // knob outer radius
			const horizontalLength = 100; // Length of horizontal line from label

			labels.forEach((label, index) => {
				const labelRect = label.getBoundingClientRect();
				const knobWrapRect = knobWrap.getBoundingClientRect();

				const angle = parseFloat(label.dataset.angle);
				const angleRad = angle * Math.PI / 180;
				const rightCount = OPTIONS.length - halfPoint;
				const isLeft = index >= rightCount;

				// Label connection point (relative to knob-wrap)
				const labelX = isLeft ?
					labelRect.right - knobWrapRect.left :
					labelRect.left - knobWrapRect.left;
				const labelY = labelRect.top + labelRect.height / 2 - knobWrapRect.top;

				// Horizontal line endpoint (100px toward knob)
				const horizontalEndX = isLeft ? labelX + horizontalLength : labelX - horizontalLength;
				const horizontalEndY = labelY;

				// Spoke start point at knob edge
				const spokeStartX = centerX + Math.cos(angleRad) * knobRadius;
				const spokeStartY = centerY + Math.sin(angleRad) * knobRadius;

				// Calculate where the spoke (extending from center at the given angle) meets the horizontal line
				// The spoke line equation: y - centerY = tan(angle) * (x - centerX)
				// The horizontal line: y = labelY
				// Solve for x where they intersect
				const dy = labelY - centerY;
				const dx = dy / Math.tan(angleRad);
				const intersectX = centerX + dx;
				const intersectY = labelY;

				// Create polyline: label -> horizontal end -> intersection -> spoke start
				const points = `${labelX},${labelY} ${horizontalEndX},${horizontalEndY} ${intersectX},${intersectY} ${spokeStartX},${spokeStartY}`;
				lines[index].setAttribute('points', points);
			});
		}

		function updateSelector() {
			// Get the target angle for the current option
			const targetAngle = parseFloat(labels[currentIndex].dataset.angle);

			if (!isInitialized) {
				// On first call, just set the angle directly
				currentAngle = targetAngle;
				isInitialized = true;
			} else {
				// Calculate the shortest angular path to the target
				// Normalize angles to 0-360 range
				let normalizedCurrent = ((currentAngle % 360) + 360) % 360;
				let normalizedTarget = ((targetAngle % 360) + 360) % 360;

				// Calculate forward and backward distances
				let forwardDist = normalizedTarget - normalizedCurrent;
				if (forwardDist < 0) forwardDist += 360;

				let backwardDist = normalizedCurrent - normalizedTarget;
				if (backwardDist < 0) backwardDist += 360;

				// Choose the shorter path
				if (backwardDist < forwardDist) {
					currentAngle = currentAngle - backwardDist;
				} else {
					currentAngle = currentAngle + forwardDist;
				}
			}

			panel.style.setProperty('--indicator-angle', `${currentAngle}deg`);

			labels.forEach((label, index) => {
				if (index === currentIndex) {
					label.classList.add('active');
					lines[index].setAttribute('opacity', '0.8');
					lines[index].setAttribute('stroke', 'var(--accent)');
				} else {
					label.classList.remove('active');
					lines[index].setAttribute('opacity', '0.4');
					lines[index].setAttribute('stroke', 'var(--ink)');
				}
			});
		}

		advanceButton.addEventListener('click', () => {
			currentIndex = (currentIndex + 1) % OPTIONS.length;
			updateSelector();
		});

		// Initialize
		setTimeout(() => {
			updateLines();
			updateSelector();
		}, 100);

		// Update on resize
		window.addEventListener('resize', updateLines);
	</script>
</body>

</html>
