<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Brutalist Input Selector</title>
	<style>
		:root {
			--bg: #1e252a;
			--ink: #f4f4f4;
			color: var(--ink);
		}

		* {
			box-sizing: border-box;
		}

		body {
			background: var(--bg);
			color: var(--ink);
			display: grid;
			place-items: center;
			min-height: 100vh;
			margin: 0;
		}
	</style>
	<script src="dial-selector.js"></script>
</head>

<body>
	<dial-selector></dial-selector>
</body>

</html>
